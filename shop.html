<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Silk Flowers | 21 Florals</title>
  <meta name="description" content="Browse our luxury silk floral catalog featuring arrangements for holidays, events, interior decor, and commercial spaces.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">21 <span>Florals</span></a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link active">Shop</a></li>
        <li><a href="custom-order.html" class="nav-link">Custom Designer</a></li>
        <li><a href="about.html" class="nav-link">About Us</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-wrapper" aria-label="Cart">
          🛒 <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Menu">☰</button>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <h1 class="section-title text-center">The Floral Collection</h1>
      <p class="section-subtitle text-center">Filter by occasion, commercial decor, or floral variety.</p>

      <!-- Search & Filters -->
      <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:2.5rem; background:#FFF; padding:1.5rem; border-radius:var(--radius-md); border:1px solid var(--clr-border);">
        <input type="text" id="searchInput" placeholder="Search arrangements or flowers..." style="padding:0.75rem 1.25rem; border:1px solid var(--clr-border); border-radius:50px; outline:none; width:100%; max-width:320px;">
        
        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
          <select id="categoryFilter" style="padding:0.75rem 1rem; border:1px solid var(--clr-border); border-radius:var(--radius-sm); background:#FFF;">
            <option value="all">All Categories</option>
            <option value="holidays">Holidays & Occasions</option>
            <option value="events">Events & Weddings</option>
            <option value="commercial">Commercial & Hotel</option>
            <option value="home">Home & Interior Decor</option>
          </select>

          <select id="sortSelect" style="padding:0.75rem 1rem; border:1px solid var(--clr-border); border-radius:var(--radius-sm); background:#FFF;">
            <option value="featured">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>
      </div>

      <!-- Catalog Grid -->
      <div class="product-grid" id="shopGrid">
        <!-- Rendered via shop.js -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 21 FLORALS. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
