<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <style>
        /* Reset margins and default setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* --------------------------------------------------
           Full Screen Image Overlay (1408x768 Optimized)
        -------------------------------------------------- */
        #image-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #image-overlay img {
            width: 100%;
            height: 100%;
            /* 'cover' makes it fill the screen smoothly while maintaining aspect ratio. 
               Use 'contain' if you don't want any part of the 1408x768 image cropped. */
            object-fit: cover; 
            display: block;
        }

        /* Class added via JavaScript to hide the overlay */
        #image-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* --------------------------------------------------
           The Real Underlying Page Content
        -------------------------------------------------- */
        #real-content {
            min-height: 100vh;
            padding: 40px;
            background-color: #f4f4f9;
            color: #333;
        }

        #real-content h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        #real-content p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- 1. Fullscreen Image Overlay -->
    <div id="image-overlay">
        <!-- Replace 'your-image.jpg' with the path or URL to your 1408x768 image -->
        <img src="21.jpg" alt="Seizure Notice Screen" id="cover-image">
    </div>

    <!-- 2. The Real Website Content (Behind the overlay) -->
    <main id="real-content">
        <h1>Welcome to the Real Page</h1>
        <p>This is the actual page content that was hiding behind the full-screen image overlay.</p>
    </main>

    <!-- 3. Keypress Detection Script -->
    <script>
        document.addEventListener('keydown', function(event) {
            // Check if the pressed key is 'x' or 'X'
            if (event.key === 'x' || event.key === 'X') {
                const overlay = document.getElementById('image-overlay');
                
                // Add class to trigger fade out transition
                overlay.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
