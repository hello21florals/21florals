<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">eta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>CopCam - Cyberpunk Tactical HUD</title> <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet"> <style> :root { --neon-pink: #ff007f; --neon-blue: #00f3ff; --neon-green: #00ff66; --neon-yellow: #ffeb3b; --neon-purple: #a100ff; --dark-bg: #05050c; } * { box-sizing: border-box; font-family: "Orbitron", sans-serif; user-select: none; } body { margin: 0; background: var(--dark-bg); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 12px; overflow-x: hidden; } /* Cyber grid background */ body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 0, 127, 0.05) 1px, transparent 1px); background-size: 30px 30px; z-index: -1; } #app { width: min(95vw, 540px); } /* Header */ .header { height: 60px; border: 2px solid var(--neon-blue); border-radius: 8px; box-shadow: 0 0 15px var(--neon-blue), inset 0 0 10px var(--neon-blue); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; font-size: 14px; font-weight: bold; letter-spacing: 1px; background: rgba(0, 15, 30, 0.8); margin-bottom: 15px; } .logo { color: var(--neon-pink); font-size: 20px; font-weight: 900; text-shadow: 0 0 10px var(--neon-pink); letter-spacing: 3px; } /* Camera viewport */ .camera-frame { width: 100%; aspect-ratio: 1/1; border: 3px solid var(--neon-pink); border-radius: 10px; box-shadow: 0 0 25px var(--neon-pink), inset 0 0 15px var(--neon-pink); background: #000; position: relative; overflow: hidden; } video { width: 100%; height: 100%; object-fit: cover; transition: filter 0.3s ease; } /* Visual FX Filters */ .filter-night { filter: brightness(1.3) contrast(1.5) tint(0,255,0) sepia(1) hue-rotate(80deg) saturate(3); } .filter-thermal { filter: contrast(2) invert(0.8) hue-rotate(180deg) saturate(5); } .filter-bw { filter: grayscale(1) contrast(1.8) brightness(0.9); } .filter-cyber { filter: saturate(2) contrast(1.3) hue-rotate(290deg); } /* HUD Reticle Overlay */ .hud-overlay { position: absolute; inset: 0; pointer-events: none; border: 2px stroke var(--neon-blue); } .hud-corner { position: absolute; width: 25px; height: 25px; border: 3px solid var(--neon-blue); } .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; } .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; } .bl { bottom: 10px; left: 10px; border-right: none; border-top: none; } .br { bottom: 10px; right: 10px; border-left: none; border-top: none; } .reticle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border: 1px dashed var(--neon-yellow); border-radius: 50%; box-shadow: 0 0 10px var(--neon-yellow); } .scanline { position: absolute; width: 100%; height: 4px; background: var(--neon-blue); opacity: 0.6; box-shadow: 0 0 10px var(--neon-blue); animation: scan 3.5s linear infinite; } @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } } /* Universal 3D Button Grid */ .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; } /* 3D Tactile Push Button Style (Fixed Dimensions) */ .btn-3d { height: 65px; width: 100%; border: none; border-radius: 8px; font-size: 11px; font-weight: 900; letter-spacing: 1px; cursor: pointer; position: relative; transition: all 0.1s ease; display: flex; flex-direction: column; justify-content: center; align-items: center; text-transform: uppercase; text-shadow: 0 0 5px rgba(0,0,0,0.8); } .btn-3d:active { transform: translateY(4px); box-shadow: 0 1px 0 #000 !important; } /* Dynamic Neon Themes for 3D Buttons */ .btn-green { background: linear-gradient(180deg, #00ff66 0%, #008033 100%); color: #000; box-shadow: 0 6px 0 #004d1f, 0 8px 15px rgba(0, 255, 102, 0.4); border: 1px solid var(--neon-green); } .btn-pink { background: linear-gradient(180deg, #ff007f 0%, #99004c 100%); color: #fff; box-shadow: 0 6px 0 #660033, 0 8px 15px rgba(255, 0, 127, 0.4); border: 1px solid var(--neon-pink); } .btn-blue { background: linear-gradient(180deg, #00f3ff 0%, #008899 100%); color: #000; box-shadow: 0 6px 0 #004d55, 0 8px 15px rgba(0, 243, 255, 0.4); border: 1px solid var(--neon-blue); } .btn-yellow { background: linear-gradient(180deg, #ffeb3b 0%, #998e00 100%); color: #000; box-shadow: 0 6px 0 #554f00, 0 8px 15px rgba(255, 235, 59, 0.4); border: 1px solid var(--neon-yellow); } .btn-purple { background: linear-gradient(180deg, #a100ff 0%, #550088 100%); color: #fff; box-shadow: 0 6px 0 #330055, 0 8px 15px rgba(161, 0, 255, 0.4); border: 1px solid var(--neon-purple); } /* Control Panels */ .panel { margin-top: 15px; border: 2px solid var(--neon-yellow); border-radius: 8px; padding: 15px; background: rgba(15, 15, 5, 0.8); box-shadow: 0 0 15px var(--neon-yellow), inset 0 0 10px rgba(255, 235, 59, 0.2); } .panel-title { font-size: 14px; font-weight: 900; margin-bottom: 12px; text-align: center; letter-spacing: 2px; color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow); } /* Row Layouts */ .motion-row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 12px; font-weight: bold; color: #fff; } input[type=range] { width: 60%; accent-color: var(--neon-yellow); } input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--neon-pink); cursor: pointer; } /* Gauges & Meters */ .meter { height: 18px; border: 1px solid var(--neon-green); border-radius: 4px; margin-top: 8px; background: #001000; overflow: hidden; } .meter-fill { height: 100%; width: 0%; background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); transition: width 0.15s ease; } /* Terminal Console */ .console { margin-top: 15px; height: 90px; border: 2px solid var(--neon-purple); border-radius: 8px; padding: 10px; overflow-y: auto; font-size: 11px; background: #030008; color: var(--neon-blue); box-shadow: 0 0 15px var(--neon-purple), inset 0 0 10px var(--neon-purple); } /* Strobe Overlay */ #strobeOverlay { position: fixed; inset: 0; pointer-events: none; z-index: 9999; display: none; } </style> </head> <body> <div id="strobeOverlay"></div> <div id="app"> <!-- Header --> <div class="header"> <div id="date" style="color:var(--neon-blue)">DATE</div> <div class="logo">COPCAM</div> <div id="clock" style="color:var(--neon-green)">TIME</div> </div> <!-- Viewport Frame --> <div class="camera-frame"> <video id="video" autoplay muted playsinline></video> <div class="scanline"></div> <div class="hud-overlay"> <div class="hud-corner tl"></div> <div class="hud-corner tr"></div> <div class="hud-corner bl"></div> <div class="hud-corner br"></div> <div class="reticle"></div> </div> </div> <!-- Main 3D Buttons Grid (Row 1: Primary Controls) --> <div class="controls-grid"> <button class="btn-3d btn-green" onclick="startCamera()">POWER ON</button> <button class="btn-3d btn-pink" onclick="stopCamera()">POWER OFF</button> <button class="btn-3d btn-blue" onclick="snapshot()">SNAP PHOTO</button> <button class="btn-3d btn-yellow" id="recBtn" onclick="toggleRecording()">REC VIDEO</button> </div> <!-- Main 3D Buttons Grid (Row 2: Tactical & FX) --> <div class="controls-grid"> <button class="btn-3d btn-purple" onclick="cycleFilters()">VISUAL FX</button> <button class="btn-3d btn-blue" onclick="switchCamera()">FLIP CAM</button> <button class="btn-3d btn-yellow" onclick="toggleAlarm()">SIREN ALARM</button> <button class="btn-3d btn-pink" onclick="toggleStrobe()">STROBE LIGHT</button> </div> <!-- Tactical Settings Panel --> <div class="panel"> <div class="panel-title">MOTION & AUDIO SENSORS</div> <div class="motion-row"> <label for="motionEnabled">AUTO MOTION DETECT</label> <input type="checkbox" id="motionEnabled"> </div> <div class="motion-row"> <label for="sensitivity">SENSITIVITY</label> <input type="range" id="sensitivity" min="1" max="100" value="50"> </div> <div class="meter"> <div class="meter-fill" id="motionBar"></div> </div> <div class="motion-row" style="margin-top:12px;"> <label>AUDIO MIC MONITOR</label> <span id="audioDb" style="color:var(--neon-blue)">0 dB</span> </div> <div class="meter" style="border-color:var(--neon-blue)"> <div class="meter-fill" id="audioBar" style="background:var(--neon-blue); box-shadow:0 0 10px var(--neon-blue)"></div> </div> </div> <!-- Terminal Console Output --> <div class="console" id="console">CopCam Cyber System Initialized...</div> </div> <script> // =============================== // Core Engine Variables // =============================== const video = document.getElementById("video"); const motionEnabled = document.getElementById("motionEnabled"); const sensitivity = document.getElementById("sensitivity"); const motionBar = document.getElementById("motionBar"); const consoleBox = document.getElementById("console"); const recBtn = document.getElementById("recBtn"); let stream = null; let recorder = null; let recordedChunks = []; let recording = false; let autoRecording = false; let previousFrame = null; let currentFilterIdx = 0; let currentFacingMode = "environment"; // Audio & Alarm Engine Contexts let audioCtx = null; let analyser = null; let microphone = null; let sirenOsc = null; let alarmActive = false; let strobeActive = false; let strobeInterval = null; const filters = ["normal", "filter-night", "filter-thermal", "filter-bw", "filter-cyber"]; // =============================== // Clock System // =============================== function updateClock() { const now = new Date(); document.getElementById("date").innerText = now.toLocaleDateString(); document.getElementById("clock").innerText = now.toLocaleTimeString(); } setInterval(updateClock, 1000); updateClock(); // =============================== // Logger Engine // =============================== function log(msg) { const time = new Date().toLocaleTimeString(); consoleBox.innerHTML += `<br>[${time}] ${msg}`; consoleBox.scrollTop = consoleBox.scrollHeight; } // =============================== // Camera Systems // =============================== async function startCamera() { if(stream) stopCamera(); try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: true }); video.srcObject = stream; log(`Camera feed active (${currentFacingMode})`); startMotionDetection(); initAudioMonitor(); } catch(error) { log("Camera Error: " + error.message); } } function stopCamera() { if(stream) { stream.getTracks().forEach(track => track.stop()); video.srcObject = null; } if(recording) stopRecording(); log("System standby"); } function switchCamera() { currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment"; log("Toggling lens facing mode..."); startCamera(); } function cycleFilters() { video.classList.remove(filters[currentFilterIdx]); currentFilterIdx = (currentFilterIdx + 1) % filters.length; if(filters[currentFilterIdx] !== "normal") { video.classList.add(filters[currentFilterIdx]); } log(`FX Mode: ${filters[currentFilterIdx].replace('filter-', '').toUpperCase()}`); } // =============================== // Snapshot & Capture Engine // =============================== function snapshot() { if(!stream) return log("Error: Feed offline"); const canvas = document.createElement("canvas"); canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 640; const ctx = canvas.getContext("2d"); // Apply active filter to image export ctx.filter = getComputedStyle(video).filter; ctx.drawImage(video, 0, 0, canvas.width, canvas.height); canvas.toBlob(blob => { saveFile(blob, `CopCam_Snap_${Date.now()}.png`); log("High-Res Snapshot Saved"); }); } // =============================== // Video Recording // =============================== function toggleRecording() { if(recording) stopRecording(); else startRecording(); } function startRecording(auto = false) { if(!stream) return log("Error: Feed offline"); recordedChunks = []; try { recorder = new MediaRecorder(stream, { mimeType: "video/webm" }); } catch(e) { return log("Recording syntax unsupported"); } recorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); }; recorder.onstop = () => { const blob = new Blob(recordedChunks, { type: "video/webm" }); saveFile(blob, `CopCam_Capture_${Date.now()}.webm`); log("Video File Exported"); }; recorder.start(); recording = true; recBtn.style.animation = "scan 1s infinite alternate"; log(auto ? "AUTO-RECORD ACTIVATED" : "Manual Recording Started"); } function stopRecording() { if(recorder && recording) recorder.stop(); recording = false; autoRecording = false; recBtn.style.animation = "none"; log("Recording Stored"); } function saveFile(blob, name) { const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); } // =============================== // Motion Detection Processor // =============================== function startMotionDetection() { const canvas = document.createElement("canvas"); const ctx = canvas.getContext("2d"); setInterval(() => { if(!motionEnabled.checked || video.readyState !== 4) return; canvas.width = 64; canvas.height = 64; ctx.drawImage(video, 0, 0, 64, 64); const frame = ctx.getImageData(0, 0, 64, 64); if(previousFrame) { let diff = 0; for(let i = 0; i < frame.data.length; i += 4) { diff += Math.abs(frame.data[i] - previousFrame.data[i]); } const motionVal = Math.min(100, Math.floor(diff / 3000)); motionBar.style.width = motionVal + "%"; const triggerLimit = 101 - Number(sensitivity.value); if(motionVal > triggerLimit && !recording) { log(`ALERT: Motion Detected (${motionVal}%)`); startRecording(true); } } previousFrame = frame; }, 200); } // =============================== // Audio Spectrum Monitor // =============================== function initAudioMonitor() { if(!stream || audioCtx) return; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); analyser = audioCtx.createAnalyser(); microphone = audioCtx.createMediaStreamSource(stream); microphone.connect(analyser); analyser.fftSize = 64; const dataArray = new Uint8Array(analyser.frequencyBinCount); setInterval(() => { analyser.getByteFrequencyData(dataArray); let sum = 0; for(let i = 0; i < dataArray.length; i++) sum += dataArray[i]; let avg = Math.floor(sum / dataArray.length); document.getElementById("audioBar").style.width = Math.min(100, avg * 1.5) + "%"; document.getElementById("audioDb").innerText = avg + " dB"; }, 100); } catch(e) { log("Mic monitoring unavailable"); } } // =============================== // Deterrent Strobe & Alarm Features // =============================== function toggleAlarm() { if(alarmActive) { if(sirenOsc) sirenOsc.stop(); alarmActive = false; log("Siren Deactivated"); } else { const ctx = new (window.AudioContext || window.webkitAudioContext)(); sirenOsc = ctx.createOscillator(); const gain = ctx.createGain(); sirenOsc.type = 'sawtooth'; sirenOsc.frequency.setValueAtTime(800, ctx.currentTime); sirenOsc.frequency.exponentialRampToValueAtTime(1600, ctx.currentTime + 0.5); sirenOsc.connect(gain); gain.connect(ctx.destination); sirenOsc.start(); alarmActive = true; log("DETERRENT SIREN ACTIVE!"); } } function toggleStrobe() { const overlay = document.getElementById("strobeOverlay"); if(strobeActive) { clearInterval(strobeInterval); overlay.style.display = "none"; strobeActive = false; log("Strobe Disabled"); } else { strobeActive = true; overlay.style.display = "block"; let state = false; strobeInterval = setInterval(() => { overlay.style.background = state ? "rgba(255, 0, 127, 0.8)" : "rgba(0, 243, 255, 0.8)"; state = !state; }, 80); log("EMERGENCY STROBE TRIGGERED!"); } } // Keyboard Hotkeys document.addEventListener("keydown", (e) => { if(e.key === "1") startCamera(); if(e.key === "2") stopCamera(); if(e.key === "3") snapshot(); if(e.key === "4") toggleRecording(); }); </script> </body> </html>
