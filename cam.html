<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>COP-CAM</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { background: #0a0a0f; font-family: 'Courier New', monospace; color: #00ffcc; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; } /* Scanline overlay */ body::after { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient( 0deg, transparent, transparent 2px, rgba(0, 255, 204, 0.03) 2px, rgba(0, 255, 204, 0.03) 4px ); pointer-events: none; z-index: 1000; } .header { width: 100%; text-align: center; padding: 15px 10px 10px; position: relative; } .header h1 { font-size: 2.2em; font-weight: 900; letter-spacing: 8px; color: #ff0066; text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066, 0 0 40px #ff0066, 0 0 80px #ff003388; animation: glitch 3s infinite; } .header .subtitle { font-size: 0.7em; color: #00ffcc; letter-spacing: 4px; margin-top: 2px; text-shadow: 0 0 10px #00ffcc; } @keyframes glitch { 0%, 90%, 100% { transform: translate(0); } 92% { transform: translate(-2px, 1px); } 94% { transform: translate(2px, -1px); } 96% { transform: translate(-1px, -1px); } 98% { transform: translate(1px, 1px); } } @keyframes neonPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } } .container { width: 100%; max-width: 500px; padding: 0 10px; display: flex; flex-direction: column; align-items: center; } .video-wrapper { width: 100%; position: relative; border: 2px solid #ff0066; box-shadow: 0 0 10px #ff006644, 0 0 30px #ff006622, inset 0 0 10px #ff006622; background: #000; aspect-ratio: 1 / 1; overflow: hidden; } .video-wrapper video, .video-wrapper canvas { width: 100%; height: 100%; object-fit: cover; display: block; } #motionCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.4; } #hiddenCanvas { display: none; } .rec-indicator { position: absolute; top: 10px; left: 10px; display: none; align-items: center; gap: 6px; z-index: 10; } .rec-indicator.active { display: flex; } .rec-dot { width: 12px; height: 12px; background: #ff0000; border-radius: 50%; animation: recBlink 1s infinite; box-shadow: 0 0 8px #ff0000; } @keyframes recBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } } .rec-text { color: #ff0000; font-size: 0.8em; font-weight: bold; text-shadow: 0 0 5px #ff0000; } .timestamp { position: absolute; bottom: 10px; right: 10px; font-size: 0.65em; color: #00ffcc; text-shadow: 0 0 5px #00ffcc; z-index: 10; } .motion-alert { position: absolute; top: 10px; right: 10px; font-size: 0.7em; color: #ffcc00; text-shadow: 0 0 10px #ffcc00; z-index: 10; display: none; animation: alertFlash 0.5s infinite; } @keyframes alertFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } } .timer-display { position: absolute; bottom: 10px; left: 10px; font-size: 0.75em; color: #ff0066; text-shadow: 0 0 5px #ff0066; z-index: 10; display: none; } .controls-row { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0; margin-top: 0; } .ctrl-btn { background: #111118; border: 1px solid #ff0066; color: #ff0066; padding: 14px 0; font-family: 'Courier New', monospace; font-size: 0.7em; font-weight: bold; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: all 0.2s; text-shadow: 0 0 5px #ff006688; position: relative; overflow: hidden; } .ctrl-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, #ff006622, transparent); transition: left 0.4s; } .ctrl-btn:hover::before, .ctrl-btn:active::before { left: 100%; } .ctrl-btn:active { background: #ff006633; box-shadow: 0 0 15px #ff006644; } .ctrl-btn.active { background: #ff006633; color: #fff; box-shadow: inset 0 0 10px #ff006644; } .ctrl-btn .icon { font-size: 1.4em; display: block; margin-bottom: 3px; } /* Motion Detection Panel */ .motion-panel { width: 100%; margin-top: 12px; border: 1px solid #00ffcc44; background: #0d0d14; padding: 12px; box-shadow: 0 0 15px #00ffcc11; } .panel-title { font-size: 0.85em; color: #00ffcc; letter-spacing: 3px; text-shadow: 0 0 8px #00ffcc; margin-bottom: 12px; text-align: center; border-bottom: 1px solid #00ffcc33; padding-bottom: 8px; } .motion-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; } .motion-label { font-size: 0.7em; color: #00ffcc99; letter-spacing: 1px; } .toggle-switch { position: relative; width: 50px; height: 26px; cursor: pointer; } .toggle-switch input { opacity: 0; width: 0; height: 0; } .toggle-slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #1a1a25; border: 1px solid #00ffcc44; border-radius: 13px; transition: 0.3s; } .toggle-slider::before { content: ''; position: absolute; height: 20px; width: 20px; left: 2px; bottom: 2px; background: #444; border-radius: 50%; transition: 0.3s; } .toggle-switch input:checked + .toggle-slider { background: #00ffcc33; border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc44; } .toggle-switch input:checked + .toggle-slider::before { transform: translateX(24px); background: #00ffcc; box-shadow: 0 0 8px #00ffcc; } .sensitivity-control { width: 100%; margin-bottom: 12px; } .sensitivity-control input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: linear-gradient(90deg, #00ffcc22, #00ffcc); border-radius: 3px; outline: none; margin-top: 6px; } .sensitivity-control input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: #00ffcc; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px #00ffcc; } .sensitivity-value { text-align: right; font-size: 0.7em; color: #00ffcc; margin-top: 4px; } /* Motion Events Bar */ .motion-bar-container { width: 100%; margin-bottom: 12px; } .motion-bar-label { display: flex; justify-content: space-between; font-size: 0.7em; color: #00ffcc99; margin-bottom: 4px; } .motion-bar-outer { width: 100%; height: 20px; background: #1a1a25; border: 1px solid #00ffcc33; border-radius: 2px; overflow: hidden; position: relative; } .motion-bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, #00ffcc, #ff0066); transition: width 0.3s; box-shadow: 0 0 10px #00ffcc44; position: relative; } .motion-bar-inner::after { content: ''; position: absolute; right: 0; top: 0; width: 4px; height: 100%; background: #fff; box-shadow: 0 0 8px #fff; opacity: 0.8; } .motion-bar-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.65em; color: #fff; text-shadow: 0 0 5px #000; font-weight: bold; z-index: 2; } /* Auto Record Duration */ .duration-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .dur-btn { flex: 1; min-width: 45px; padding: 8px 4px; background: #1a1a25; border: 1px solid #ff006644; color: #ff006699; font-family: 'Courier New', monospace; font-size: 0.7em; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; } .dur-btn.active { background: #ff006633; border-color: #ff0066; color: #ff0066; box-shadow: 0 0 8px #ff006644; text-shadow: 0 0 5px #ff0066; } .dur-btn:active { background: #ff006644; } .status-bar { width: 100%; margin-top: 12px; padding: 8px; border: 1px solid #00ffcc22; background: #0a0a10; text-align: center; } .status-text { font-size: 0.65em; color: #00ffcc88; letter-spacing: 2px; } .status-text.recording { color: #ff0066; animation: alertFlash 1s infinite; } .gallery-section { width: 100%; margin-top: 12px; margin-bottom: 20px; } .gallery-title { font-size: 0.75em; color: #00ffcc88; letter-spacing: 2px; margin-bottom: 8px; text-align: center; } .gallery-list { max-height: 150px; overflow-y: auto; border: 1px solid #00ffcc22; background: #0a0a10; } .gallery-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #00ffcc11; font-size: 0.65em; } .gallery-item:last-child { border-bottom: none; } .gallery-item .name { color: #00ffcc99; } .gallery-item .dl-btn { background: none; border: 1px solid #ff006666; color: #ff0066; padding: 3px 8px; font-family: 'Courier New', monospace; font-size: 0.9em; cursor: pointer; } .gallery-item .dl-btn:active { background: #ff006633; } .gallery-list::-webkit-scrollbar { width: 4px; } .gallery-list::-webkit-scrollbar-track { background: #0a0a10; } .gallery-list::-webkit-scrollbar-thumb { background: #00ffcc44; } /* Corner decorations on video */ .corner { position: absolute; width: 20px; height: 20px; z-index: 10; } .corner-tl { top: 0; left: 0; border-top: 2px solid #00ffcc; border-left: 2px solid #00ffcc; box-shadow: -2px -2px 8px #00ffcc44; } .corner-tr { top: 0; right: 0; border-top: 2px solid #00ffcc; border-right: 2px solid #00ffcc; box-shadow: 2px -2px 8px #00ffcc44; } .corner-bl { bottom: 0; left: 0; border-bottom: 2px solid #00ffcc; border-left: 2px solid #00ffcc; box-shadow: -2px 2px 8px #00ffcc44; } .corner-br { bottom: 0; right: 0; border-bottom: 2px solid #00ffcc; border-right: 2px solid #00ffcc; box-shadow: 2px 2px 8px #00ffcc44; } .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; z-index: 10; pointer-events: none; opacity: 0.3; } .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #00ffcc; } .crosshair::before { width: 1px; height: 100%; left: 50%; } .crosshair::after { width: 100%; height: 1px; top: 50%; } </style> </head> <body> <div class="header"> <h1>COP-CAM</h1> <div class="subtitle">▸ SURVEILLANCE SYSTEM ◂</div> </div> <div class="container"> <!-- Video Preview --> <div class="video-wrapper" id="videoWrapper"> <video id="videoPreview" autoplay playsinline muted></video> <canvas id="motionCanvas"></canvas> <canvas id="hiddenCanvas"></canvas> <div class="corner corner-tl"></div> <div class="corner corner-tr"></div> <div class="corner corner-bl"></div> <div class="corner corner-br"></div> <div class="crosshair"></div> <div class="rec-indicator" id="recIndicator"> <div class="rec-dot"></div> <span class="rec-text">REC</span> </div> <div class="motion-alert" id="motionAlert">⚠ MOTION</div> <div class="timestamp" id="timestamp"></div> <div class="timer-display" id="timerDisplay">00:00</div> </div> <!-- 4 Control Buttons --> <div class="controls-row"> <button class="ctrl-btn" id="btnRecord" onclick="toggleRecord()"> <span class="icon">⏺</span> REC </button> <button class="ctrl-btn" id="btnPhoto" onclick="takePhoto()"> <span class="icon">📷</span> PHOTO </button> <button class="ctrl-btn" id="btnFlip" onclick="flipCamera()"> <span class="icon">🔄</span> FLIP </button> <button class="ctrl-btn" id="btnLight" onclick="toggleLight()"> <span class="icon">💡</span> LIGHT </button> </div> <!-- Motion Detection Panel --> <div class="motion-panel"> <div class="panel-title">▸ MOTION DETECTION ◂</div> <div class="motion-row"> <span class="motion-label">ENABLE DETECTION</span> <label class="toggle-switch"> <input type="checkbox" id="motionToggle" onchange="toggleMotionDetection()"> <span class="toggle-slider"></span> </label> </div> <div class="sensitivity-control"> <div class="motion-row" style="margin-bottom:4px;"> <span class="motion-label">SENSITIVITY</span> <span class="sensitivity-value" id="sensValue">50%</span> </div> <input type="range" id="sensitivitySlider" min="1" max="100" value="50" oninput="updateSensitivity()"> </div> <div class="motion-bar-container"> <div class="motion-bar-label"> <span>MOTION EVENTS</span> <span id="motionPercent">0%</span> </div> <div class="motion-bar-outer"> <div class="motion-bar-inner" id="motionBar"></div> <div class="motion-bar-text" id="motionBarText">0%</div> </div> </div> <div class="motion-row" style="flex-direction:column;align-items:flex-start;"> <span class="motion-label" style="margin-bottom:8px;">AUTO-RECORD DURATION</span> <div class="duration-row" style="width:100%;"> <button class="dur-btn active" data-dur="1" onclick="setDuration(1, this)">1 MIN</button> <button class="dur-btn" data-dur="3" onclick="setDuration(3, this)">3 MIN</button> <button class="dur-btn" data-dur="5" onclick="setDuration(5, this)">5 MIN</button> <button class="dur-btn" data-dur="10" onclick="setDuration(10, this)">10 MIN</button> </div> </div> </div> <!-- Status Bar --> <div class="status-bar"> <div class="status-text" id="statusText">◈ SYSTEM STANDBY ◈</div> </div> <!-- Gallery --> <div class="gallery-section"> <div class="gallery-title">▸ RECORDINGS ◂</div> <div class="gallery-list" id="galleryList"> </div> </div> </div> <script> // State let stream = null; let mediaRecorder = null; let recordedChunks = []; let isRecording = false; let facingMode = 'environment'; let lightOn = false; let track = null; // Motion detection state let motionEnabled = false; let sensitivity = 50; let autoRecordDuration = 1; // minutes let motionDetected = false; let motionPercentage = 0; let prevFrame = null; let motionCheckInterval = null; let motionAutoRecording = false; let motionCooldown = false; // Recording timer let recordStartTime = null; let recordTimerInterval = null; let autoRecordTimeout = null; // Gallery let recordings = []; // Elements const videoPreview = document.getElementById('videoPreview'); const motionCanvas = document.getElementById('motionCanvas'); const hiddenCanvas = document.getElementById('hiddenCanvas'); const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true }); const hiddenCtx = hiddenCanvas.getContext('2d', { willReadFrequently: true }); const recIndicator = document.getElementById('recIndicator'); const motionAlert = document.getElementById('motionAlert'); const timestampEl = document.getElementById('timestamp'); const timerDisplay = document.getElementById('timerDisplay'); const statusText = document.getElementById('statusText'); const motionBar = document.getElementById('motionBar'); const motionBarText = document.getElementById('motionBarText'); const motionPercent = document.getElementById('motionPercent'); // Init camera async function initCamera() { try { if (stream) { stream.getTracks().forEach(t => t.stop()); } const constraints = { video: { facingMode: facingMode, width: { ideal: 1080 }, height: { ideal: 1080 } }, audio: true }; stream = await navigator.mediaDevices.getUserMedia(constraints); videoPreview.srcObject = stream; track = stream.getVideoTracks()[0]; setStatus('◈ CAMERA ACTIVE ◈'); } catch (err) { console.error('Camera error:', err); setStatus('⚠ CAMERA ERROR ⚠'); } } // Timestamp function updateTimestamp() { const now = new Date(); const ts = now.toLocaleString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }); timestampEl.textContent = ts; } setInterval(updateTimestamp, 1000); updateTimestamp(); // Record function toggleRecord() { if (isRecording) { stopRecording(); } else { startRecording(); } } function startRecording(isAuto = false) { if (isRecording || !stream) return; recordedChunks = []; const mimeTypes = [ 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4' ]; let selectedMime = ''; for (const mime of mimeTypes) { if (MediaRecorder.isTypeSupported(mime)) { selectedMime = mime; break; } } try { mediaRecorder = new MediaRecorder(stream, selectedMime ? { mimeType: selectedMime } : {}); } catch (e) { mediaRecorder = new MediaRecorder(stream); } mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) { recordedChunks.push(e.data); } }; mediaRecorder.onstop = () => { const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' }); saveRecording(blob); recordedChunks = []; }; mediaRecorder.start(1000); isRecording = true; const btn = document.getElementById('btnRecord'); btn.classList.add('active'); btn.querySelector('.icon').textContent = '⏹'; recIndicator.classList.add('active'); timerDisplay.style.display = 'block'; recordStartTime = Date.now(); recordTimerInterval = setInterval(updateRecordTimer, 1000); if (isAuto) { motionAutoRecording = true; setStatus('◈ AUTO-RECORDING [MOTION] ◈', true); autoRecordTimeout = setTimeout(() => { stopRecording(); motionAutoRecording = false; motionCooldown = true; setTimeout(() => { motionCooldown = false; }, 5000); }, autoRecordDuration * 60 * 1000); } else { setStatus('◈ RECORDING ◈', true); } } function stopRecording() { if (!isRecording || !mediaRecorder) return; mediaRecorder.stop(); isRecording = false; motionAutoRecording = false; if (autoRecordTimeout) { clearTimeout(autoRecordTimeout); autoRecordTimeout = null; } const btn = document.getElementById('btnRecord'); btn.classList.remove('active'); btn.querySelector('.icon').textContent = '⏺'; recIndicator.classList.remove('active'); timerDisplay.style.display = 'none'; clearInterval(recordTimerInterval); setStatus('◈ RECORDING SAVED ◈'); setTimeout(() => { if (!isRecording) setStatus('◈ CAMERA ACTIVE ◈'); }, 2000); } function updateRecordTimer() { if (!recordStartTime) return; const elapsed = Math.floor((Date.now() - recordStartTime) / 1000); const mins = String(Math.floor(elapsed / 60)).padStart(2, '0'); const secs = String(elapsed % 60).padStart(2, '0'); timerDisplay.textContent = `${mins}:${secs}`; } function saveRecording(blob) { const now = new Date(); const name = `COP-CAM_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`; const url = URL.createObjectURL(blob); recordings.unshift({ name, url, blob, time: now.toLocaleTimeString() }); if (recordings.length > 20) { const old = recordings.pop(); URL.revokeObjectURL(old.url); } updateGallery(); } function updateGallery() { const list = document.getElementById('galleryList'); if (recordings.length === 0) { list.innerHTML = '<div style="padding:15px;text-align:center;font-size:0.65em;color:#00ffcc44;">NO RECORDINGS</div>'; return; } list.innerHTML = recordings.map((r, i) => ` <div class="gallery-item"> <span class="name">${r.name}</span> <button class="dl-btn" onclick="downloadRecording(${i})">⬇ SAVE</button> </div> `).join(''); } function downloadRecording(index) { const r = recordings[index]; const a = document.createElement('a'); a.href = r.url; a.download = r.name + '.webm'; document.body.appendChild(a); a.click(); document.body.removeChild(a); } // Photo function takePhoto() { if (!stream) return; const canvas = document.createElement('canvas'); const video = videoPreview; const size = Math.min(video.videoWidth, video.videoHeight); canvas.width = size; canvas.height = size; const ctx = canvas.getContext('2d'); const sx = (video.videoWidth - size) / 2; const sy = (video.videoHeight - size) / 2; ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size); // Add timestamp overlay ctx.fillStyle = '#00ffcc'; ctx.font = `${Math.floor(size/30)}px Courier New`; ctx.textAlign = 'right'; ctx.fillText(new Date().toLocaleString(), size - 10, size - 10); canvas.toBlob((blob) => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `COP-CAM_PHOTO_${Date.now()}.jpg`; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 5000); }, 'image/jpeg', 0.9); // Flash effect const wrapper = document.getElementById('videoWrapper'); wrapper.style.boxShadow = '0 0 30px #00ffcc, inset 0 0 30px #00ffcc44'; setTimeout(() => { wrapper.style.boxShadow = ''; }, 200); setStatus('◈ PHOTO CAPTURED ◈'); setTimeout(() => { if (!isRecording) setStatus('◈ CAMERA ACTIVE ◈'); }, 1500); } // Flip camera async function flipCamera() { facingMode = facingMode === 'environment' ? 'user' : 'environment'; lightOn = false; const wasRecording = isRecording; if (wasRecording) stopRecording(); await initCamera(); if (wasRecording) startRecording(); } // Flashlight async function toggleLight() { if (!track) return; try { const capabilities = track.getCapabilities(); if (capabilities.torch) { lightOn = !lightOn; await track.applyConstraints({ advanced: [{ torch: lightOn }] }); const btn = document.getElementById('btnLight'); if (lightOn) { btn.classList.add('active'); } else { btn.classList.remove('active'); } } else { setStatus('⚠ NO TORCH AVAILABLE ⚠'); setTimeout(() => { if (!isRecording) setStatus('◈ CAMERA ACTIVE ◈'); }, 1500); } } catch (err) { console.error('Torch error:', err); } } // Motion Detection function toggleMotionDetection() { motionEnabled = document.getElementById('motionToggle').checked; if (motionEnabled) { startMotionDetection(); setStatus('◈ MOTION DETECTION ON ◈'); } else { stopMotionDetection(); setStatus('◈ MOTION DETECTION OFF ◈'); motionAlert.style.display = 'none'; updateMotionBar(0); } setTimeout(() => { if (!isRecording) setStatus('◈ CAMERA ACTIVE ◈'); }, 1500); } function startMotionDetection() { prevFrame = null; // Set canvas sizes hiddenCanvas.width = 160; hiddenCanvas.height = 160; motionCanvas.width = 160; motionCanvas.height = 160; if (motionCheckInterval) clearInterval(motionCheckInterval); motionCheckInterval = setInterval(detectMotion, 200); } function stopMotionDetection() { if (motionCheckInterval) { clearInterval(motionCheckInterval); motionCheckInterval = null; } prevFrame = null; motionCtx.clearRect(0, 0, motionCanvas.width, motionCanvas.height); } function detectMotion() { if (!stream || !motionEnabled) return; const video = videoPreview; if (video.readyState < 2) return; const w = hiddenCanvas.width; const h = hiddenCanvas.height; hiddenCtx.drawImage(video, 0, 0, w, h); const currentFrame = hiddenCtx.getImageData(0, 0, w, h); if (!prevFrame) { prevFrame = currentFrame; return; } const threshold = Math.max(5, 100 - sensitivity); // Higher sensitivity = lower threshold let changedPixels = 0; const totalPixels = w * h; const diffData = motionCtx.createImageData(w, h); for (let i = 0; i < currentFrame.data.length; i += 4) { const rDiff = Math.abs(currentFrame.data[i] - prevFrame.data[i]); const gDiff = Math.abs(currentFrame.data[i+1] - prevFrame.data[i+1]); const bDiff = Math.abs(currentFrame.data[i+2] - prevFrame.data[i+2]); const avgDiff = (rDiff + gDiff + bDiff) / 3; if (avgDiff > threshold) { changedPixels++; diffData.data[i] = 255; // R diffData.data[i+1] = 0; // G diffData.data[i+2] = 102; // B (neon pink) diffData.data[i+3] = 180; // A } else { diffData.data[i+3] = 0; } } motionCtx.putImageData(diffData, 0, 0); prevFrame = currentFrame; motionPercentage = Math.min(100, Math.round((changedPixels / totalPixels) * 100 * 5)); updateMotionBar(motionPercentage); // Trigger threshold: if more than 2% of pixels changed significantly const triggerThreshold = Math.max(1, 10 - Math.floor(sensitivity / 12)); if (motionPercentage > triggerThreshold) { motionAlert.style.display = 'block'; motionDetected = true; // Auto-record on motion if (!isRecording && !motionCooldown) { startRecording(true); } } else { motionAlert.style.display = 'none'; motionDetected = false; } } function updateMotionBar(percent) { motionBar.style.width = percent + '%'; motionBarText.textContent = percent + '%'; motionPercent.textContent = percent + '%'; // Color coding if (percent > 60) { motionBar.style.background = 'linear-gradient(90deg, #ff0066, #ff0000)'; } else if (percent > 30) { motionBar.style.background = 'linear-gradient(90deg, #ffcc00, #ff0066)'; } else { motionBar.style.background = 'linear-gradient(90deg, #00ffcc, #ff0066)'; } } function updateSensitivity() { sensitivity = parseInt(document.getElementById('sensitivitySlider').value); document.getElementById('sensValue').textContent = sensitivity + '%'; } function setDuration(mins, btn) { autoRecordDuration = mins; document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); } function setStatus(text, isRec = false) { statusText.textContent = text; if (isRec) { statusText.classList.add('recording'); } else { statusText.classList.remove('recording'); } } // Init updateGallery(); initCamera(); </script> </body> </html>
